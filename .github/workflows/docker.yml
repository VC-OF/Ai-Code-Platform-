name: Docker Build & Push

on:
  push:
    branches: [main]
    tags:     ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload-sarif (Trivy results → code scanning)

    steps:
      - uses: actions/checkout@v4

      # The repository is "Ai-Code-Platform-": lowercased that is
      # "vc-of/ai-code-platform-", and an image name may not end in a
      # separator ("invalid reference format"). Lowercase and trim trailing
      # '-', '_' and '.' → ghcr.io/vc-of/ai-code-platform
      - name: Image name
        id: image
        run: |
          name="${GITHUB_REPOSITORY,,}"
          name="$(printf '%s' "$name" | sed -E 's/[-_.]+$//')"
          echo "ref=${REGISTRY}/${name}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REGISTRY}/${name}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:   .
          target:    runner
          push:      ${{ github.event_name != 'pull_request' }}
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}

      - name: Scan for vulnerabilities
        # Pinned: this step runs with a token that can push packages and
        # write security events, so no floating @master
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Matches the type=sha,format=long tag above (the default short
          # format produced sha-<7 chars>, so this ref never existed)
          image-ref: ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
          format:    sarif
          output:    trivy-results.sarif

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
