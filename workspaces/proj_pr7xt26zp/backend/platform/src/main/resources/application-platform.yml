spring:
  application:
    name: banking-platform
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        default_schema: bank
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

security:
  jwt:
    issuer: banking-platform
    audience: banking-clients
    hmac-secret: ${JWT_HMAC_SECRET:please-change-this-to-a-32-byte-or-longer-secret-value}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600
    mfa-token-ttl-seconds: 300
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      - http://localhost:4173
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:ZGV2LW1hc3Rlci1rZXktcGxlYXNlLXJlcGxhY2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
  rate-limit:
    enabled: true
    default-requests-per-minute: 120
    auth-requests-per-minute: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.bank: DEBUG
    org.springframework.security: INFO
  pattern:
    level: "%5p [%X{requestId:-}]"
